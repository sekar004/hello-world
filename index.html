<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Docker App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="globe globe-3"></div>
    </div>

    <div class="container">
        <header class="card-header">
            <div class="badge">
                <i class="fab fa-docker"></i> Docker Ready
            </div>
            <button id="themeToggle" class="icon-btn" title="Toggle Theme">
                <i class="fas fa-moon"></i>
            </button>
        </header>

        <main class="card-body">
            <div class="icon-hero">
                <i class="fas fa-rocket"></i>
            </div>
            <h1 class="title">Hello World! 🚀</h1>
            <p class="subtitle">Welcome to your Docker containerized practice frontend app.</p>
            
            <div class="status-box">
                <div class="status-item">
                    <span class="status-dot green"></span>
                    <span class="status-text">Status: <strong>Running Successfully</strong></span>
                </div>
                <div class="status-item">
                    <i class="fas fa-clock"></i>
                    <span id="uptimeCounter">Uptime: 0s</span>
                </div>
            </div>

            <div class="interactive-section">
                <div class="counter-box">
                    <span class="counter-label">Interactive Counter</span>
                    <div class="counter-controls">
                        <button id="btnDecrement" class="btn btn-secondary">-</button>
                        <span id="counterValue">0</span>
                        <button id="btnIncrement" class="btn btn-primary">+</button>
                    </div>
                </div>
            </div>

            <div class="info-cards">
                <div class="info-card">
                    <i class="fas fa-cubes"></i>
                    <h3>Containerized</h3>
                    <p>Served via Nginx inside Docker</p>
                </div>
                <div class="info-card">
                    <i class="fas fa-bolt"></i>
                    <h3>Lightweight</h3>
                    <p>Minimal footprint, instant load</p>
                </div>
            </div>
        </main>

        <footer class="card-footer">
            <p>Deployed with ❤️ by <a href="https://github.com/sekar004/hello-world" target="_blank">sekar004</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
